name: Student App CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Automated Tests
      run: |
        pytest

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/grade-app:${{ github.sha }}

    - name: Set up Kubeconfig
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBECONFIG }}

    - name: Update Image Tag in Manifest
      run: |
        sed -i 's|DOCKERHUB_USERNAME/grade-app:IMAGE_TAG|${{ secrets.DOCKERHUB_USERNAME }}/grade-app:${{ github.sha }}|g' k8s/deployment.yaml

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s/service.yaml
        kubectl apply -f k8s/deployment.yaml
        
    - name: Create local Kubernetes Cluster (Kind)
      uses: helm/kind-action@v1.10.0
      with:
        cluster_name: kind-cluster

    - name: Update Image Tag in Manifest
      run: |
        sed -i 's|DOCKERHUB_USERNAME/student-app:IMAGE_TAG|${{ secrets.DOCKERHUB_USERNAME }}/student-app:${{ github.sha }}|g' k8s/deployment.yaml

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s/service.yaml
        kubectl apply -f k8s/deployment.yaml

