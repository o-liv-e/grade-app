apiVersion: apps/v1
kind: Deployment
metadata:
  name: grade-app-deployment
  labels:
    app: grade-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grade-app
  template:
    metadata:
      labels:
        app: grade-app
    spec:
      containers:
      - name: grade-app-container
        image: oliveprishita/grade-app:IMAGE_TAG
        ports:
        - containerPort: 5000
